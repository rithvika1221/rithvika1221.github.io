name: Sync site from rithvika.dev

# Copies the live https://rithvika.dev page into this repo as index.html.
# Run it again any time from the Actions tab ("Run workflow") after updating rithvika.dev.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-from-rithvika-dev.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download rithvika.dev
        run: |
          curl -fsSL https://rithvika.dev/ -o index.new.html
          size=$(wc -c < index.new.html)
          echo "Downloaded $size bytes"
          grep -q "Rithvika Devisetti" index.new.html
          [ "$size" -gt 20000 ]
          mv index.new.html index.html
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Sync index.html from rithvika.dev"
          git push
